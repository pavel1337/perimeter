<div class="container" style="max-width: 400px; margin-top: 80px;">

<h1>Register</h1>

{{if .Error}}
<div class="alert alert-error">{{.Error}}</div>
{{end}}

<form action="/register" method="POST">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" name="name" id="name" required style="width: 100%;">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required style="width: 100%;"
      {{if .InviteEmail}}value="{{.InviteEmail}}" readonly{{end}}>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required minlength="8" style="width: 100%;">
  </div>
  <input type="hidden" name="token" value="{{.InviteToken}}">
  <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
</form>

</div>
