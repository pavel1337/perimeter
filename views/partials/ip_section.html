<table>
  <thead>
    <tr>
      <th>Time</th>
      <th>Open Ports</th>
    </tr>
  </thead>
  <tbody>
    {{range .Scans}}
    <tr>
      <td class="text-muted">{{.ScannedAt.Format "Jan 02, 2006 15:04"}}</td>
      <td>
        {{if .Edges.Ports}}
        {{range .Edges.Ports}}<span class="badge badge-red">{{.Number}}</span> {{end}}
        {{else}}
        <span class="badge badge-green">none</span>
        {{end}}
      </td>
    </tr>
    {{else}}
    <tr><td colspan="2" class="text-muted">No scans yet.</td></tr>
    {{end}}
  </tbody>
</table>
{{template "views/partials/pagination" .Pagination}}
