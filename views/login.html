<div class="container" style="max-width: 400px; margin-top: 80px;">

<h1>Login</h1>

{{if .Error}}
<div class="alert alert-error">{{.Error}}</div>
{{end}}

<form action="/login" method="POST">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required style="width: 100%;">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required style="width: 100%;">
  </div>
  <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
</form>

{{if .OIDCEnabled}}
<div style="text-align: center; margin: 20px 0; color: #aaa; font-size: 13px;">or</div>
<a href="/auth/oidc" class="btn" style="display: block; text-align: center; width: 100%; padding: 8px;">Login with SSO</a>
{{end}}

</div>
