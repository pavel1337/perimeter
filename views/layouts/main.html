<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perimeter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1a1a1a;
      background: #fafafa;
      line-height: 1.5;
      font-size: 14px;
    }

    nav {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 0 24px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav a {
      color: #555;
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      margin-right: 20px;
      padding: 14px 0;
      border-bottom: 2px solid transparent;
    }

    nav a:hover, nav a.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #888;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    h2 { font-size: 16px; font-weight: 600; margin: 28px 0 12px; }
    h3 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      background: #f7f7f7;
      border-bottom: 1px solid #e5e5e5;
      font-weight: 600;
      color: #555;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }

    input, textarea, select {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      outline: none;
    }

    input:focus, textarea:focus, select:focus { border-color: #2563eb; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #444;
    }

    button, .btn {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      color: #333;
      font-weight: 500;
    }

    button:hover, .btn:hover { background: #f5f5f5; }

    .btn-primary {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .btn-primary:hover { background: #333; }

    .btn-danger { color: #dc2626; border-color: #fca5a5; }
    .btn-danger:hover { background: #fef2f2; }

    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }

    .form-group { margin-bottom: 14px; }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .badge-green { background: #dcfce7; color: #166534; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-gray { background: #f3f4f6; color: #4b5563; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    .text-muted { color: #888; font-size: 12px; }

    .mono { font-family: "SF Mono", "Cascadia Code", "Consolas", monospace; font-size: 12px; }

    footer {
      margin-top: 40px;
      padding: 16px 0;
      border-top: 1px solid #e5e5e5;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>
  {{embed}}
</body>

</html>
