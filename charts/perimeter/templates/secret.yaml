apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "perimeter.labels" . | nindent 4 }}
type: Opaque
stringData:
  HTTP_PORT: {{ .Values.service.port | quote }}
  {{- if .Values.persistence.enabled }}
  DB_PATH: /data/perimeter.db
  {{- end }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
